name: Build APKs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: bash ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:assembleStandardDebug :app:assembleCloneDebug

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AEmulator-debug-apks
          path: |
            app/build/outputs/apk/standard/debug/*.apk
            app/build/outputs/apk/clone/debug/*.apk
          if-no-files-found: error
          retention-days: 14